name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - recording-overlay-test
    paths:
      - 'app_pojavlauncher/**'
      - 'androidnsbypass/**'
      - 'arc_dns_injector/**'
      - 'forge_installer/**'
      - 'MioLibPatcher/**'
      - 'jre_lwjgl3glfw/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.properties'
      - 'gradlew'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches:
      - recording-overlay-test

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # MioLibPatcher compiles against a Java 8 toolchain. Install it first,
      # then restore Java 21 as the JVM used to run the Android Gradle build.
      - name: Set up Java 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's sdkmanager update step, which failed before
      # Gradle could start in the previous run.
      - name: Show Android SDK configuration
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || (echo "Android SDK not found at ANDROID_HOME" && exit 1)
          ls "$ANDROID_HOME"

      - name: Configure Maven Central mirror for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
              buildscript {
                  repositories {
                      maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                      mavenCentral()
                  }
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  gradlePluginPortal()
                  google()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
                  google()
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ElytraLauncher-recording-overlay-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
